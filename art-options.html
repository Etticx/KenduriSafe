<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Art Options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ivory: #FEFEFD; --coal: #080808; --blue: #154ECD; --ink-2: #4a4a48; --line: #e6e6e3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--coal); font-family: Inter, system-ui, sans-serif; padding: 48px 16px 80px; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 500; letter-spacing: -.03em; }
  .intro { margin-top: 12px; color: var(--ink-2); max-width: 640px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: 40px; }
  figure { border: 1px solid var(--line); background: #fff; }
  canvas { display: block; width: 100%; aspect-ratio: 2 / 1; background: var(--ivory); }
  figcaption { padding: 16px 18px 20px; border-top: 1px solid var(--line); }
  .tag { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--blue); letter-spacing: .06em; }
  figcaption b { display: block; margin-top: 6px; font-size: 18px; font-weight: 600; }
  figcaption p { margin-top: 6px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hero art options</h1>
  <p class="intro">Same dot style and colours as the page, different subjects. Each one can be split into layers for the scroll parallax. Tell me the letter you like.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
// Shared dither engine (same palette, texture and grainy halftone as kendurisafe.html).
const PAL = ['#FEFEFD', '#EEF1F5', '#DDE3EA', '#C9D2DD', '#B3C0D2', '#8EA9DE', '#6B95EE', '#4A80F2', '#2F6BF0', '#1F5BE0', '#154ECD'];
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + .5) / 16);
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const N = Array.from({ length: 512 }, rnd);
const sm = f => f * f * (3 - 2 * f);
const h2 = (i, j) => N[(i + N[j & 511] * 512 | 0) & 511];
const noise2 = (x, y) => {
  const i = Math.floor(x), j = Math.floor(y), tx = sm(x - i), ty = sm(y - j);
  const a = h2(i, j) * (1 - tx) + h2(i + 1, j) * tx, b = h2(i, j + 1) * (1 - tx) + h2(i + 1, j + 1) * tx;
  return a * (1 - ty) + b * ty;
};
const frac = x => x - Math.floor(x);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const tri = t => 1 - Math.abs(2 * t - 1);
const hang = f => .45 + .55 * Math.sqrt(Math.max(0, 1 - (2 * f - 1) ** 2)); // one scallop
const inEll = (X, Y, cx, cy, rx, ry) => ((X - cx) / rx) ** 2 + ((Y - cy) / ry) ** 2 <= 1;
const segDist = (X, Y, ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, t = clamp(((X - ax) * dx + (Y - ay) * dy) / (dx * dx + dy * dy)); return Math.hypot(X - ax - t * dx, Y - ay - t * dy); };

// Scenes work in height units: Y 0 (top) .. 1 (bottom), X 0 .. 2 (2:1 tile). Return 0..1 (darkness), or -1 for empty.
const SCENES = [
  { id: 'A', name: 'One big khemah', note: 'A single large canopy tent with a scalloped valance over a table of tudung saji. One tent, so no castle look. Parallax: tent roof, table, ground.', fn(X, Y) {
    const cx = 1.32, half = .56, peak = .1, eave = .42;
    // table and domes in front
    for (const d of [-.32, 0, .32]) if (Y <= .74 && inEll(X, Y, cx + d, .74, .11, .1)) return Y < .645 && Math.abs(X - cx - d) < .012 ? .9 : (X < cx + d ? .55 : .9);
    if (X > cx - .5 && X < cx + .5 && Y >= .74 && Y < .9) return Y < .74 + .035 * hang(frac((X - cx) * 9)) ? .95 : .14;
    if (X > cx - half && X < cx + half) {
      const t = (X - cx + half) / (2 * half), top = eave - (eave - peak) * tri(t) ** 1.5;
      if (Y >= top && Y < eave) return t < .5 ? .22 + .1 * Y : .45;
      const valB = eave + .05 * hang(frac(t * 9));
      if (Y >= eave && Y < valB) return .85;
      if (Math.min(t, 1 - t) * 2 * half < .014 && Y >= eave && Y < .93) return .3;
      if (Y >= valB && Y < .93) return .55 - .35 * (Y - valB) / (.93 - valB);
    }
    if (Y >= .93) return .2 * clamp((X - .3) / 1.2);
    return -1;
  } },
  { id: 'B', name: 'Kawah with steam', note: 'The giant kenduri cooking pot over a wood fire, steam curling up. Parallax: steam drifts up faster than the pot.', fn(X, Y) {
    const cx = 1.35, rim = .58, rx = .44, dp = .27;
    if (Math.abs(X - cx) < rx * 1.05 && Y > rim - .03 && Y < rim + .012) return .95;                         // rim
    for (const s of [-1, 1]) { const d = Math.hypot(X - (cx + s * rx * 1.08), Y - (rim + .05)); if (d > .028 && d < .048) return .9; } // handles
    if (Y >= rim && inEll(X, Y, cx, rim, rx, dp)) return .55 + .38 * (X - cx) / rx + .06 * Math.sin(Y * 80) * 0;  // bowl, lit from the left
    for (const s of [-1, 1]) if (segDist(X, Y, cx - .3 * s, .97, cx + .25 * s, .84) < .02) return .85;          // crossed firewood
    if (Y > .8 && Y < .95 && Math.abs(X - cx) < .2 && noise2(X * 18, Y * 9 - 3) > .45 + (Y - .8)) return .7;      // flames
    for (const s of [-1, 1]) if (Math.abs(X - (cx + s * .36)) < .06 && Y > .8 && Y < .96) return .7;           // stones
    if (Y >= .96) return .22;
    if (Y < rim) { // steam: three wavy plumes widening as they rise
      let dens = 0;
      for (const o of [-.17, 0, .17]) {
        const h = rim - Y, xc = cx + o + .12 * Math.sin(Y * 11 + o * 20) * (h / rim), w = .025 + h * .08; // thin wisps that sway as they rise
        dens = Math.max(dens, Math.exp(-(((X - xc) / w) ** 2)) * (1 - h / (rim * .95)));
      }
      dens *= .5 + noise2(X * 22, Y * 6);
      if (dens > .35) return .1 + .45 * dens;
    }
    return -1;
  } },
  { id: 'C', name: 'Tudung saji close-up', note: 'One big woven food cover on a footed dulang: "what\'s underneath is safe". Scroll idea: the lid lifts to reveal the dishes.', fn(X, Y) {
    const cx = 1.35, base = .76, rx = .5, ry = .56;
    if (inEll(X, Y, cx, base - ry - .025, .04, .035)) return .95;                                              // knob
    if (Y <= base && inEll(X, Y, cx, base, rx, ry)) {
      if (Y > base - .03) return .97;                                                                         // rim band
      for (const k of [.35, .65]) if (Math.abs(Y - (base - ry * k)) < .016) return .95;                       // decorative rings
      const u = X - cx, weave = (frac((u + Y) * 13) < .5) !== (frac((u - Y) * 13) < .5);
      return (weave ? .5 : .78) - .28 * (1 - (u + rx) / (2 * rx));                                             // woven, lit from the left
    }
    if (inEll(X, Y, cx, base + .025, .64, .05)) return Y < base + .02 ? .45 : .8;                             // tray
    if (Y > base + .06 && Y < .93 && Math.abs(X - cx) < .1 + (Y - base) * .5) return .62;                    // foot
    if (Y >= .93) return .18 * clamp((X - .4) / 1.2);
    return -1;
  } },
  { id: 'D', name: 'Bunga manggar', note: 'The tall palm-blossom sprays lining a Malay wedding walkway. Very "majlis". Parallax: back sprays smaller and slower.', fn(X, Y) {
    const stalks = [[.98, .34, .13], [1.18, .2, .16], [1.38, .1, .18], [1.58, .22, .16], [1.78, .36, .13]];
    for (const [x, top, R] of stalks) {
      const dx = X - x, dy = Y - top, d = Math.hypot(dx, dy);
      if (d < R && d > .012) {
        const a = Math.atan2(dy, dx), k = frac(a / (2 * Math.PI) * 24 + d * 3);                                // strands, slightly swirled
        if (k < .17) return d > R * .85 ? .95 : .45 + .4 * d / R;
      }
      if (d <= .016) return .95;
      if (Math.abs(dx) < .007 && Y > top && Y < .88) return .78;                                               // stalk
    }
    if (Y >= .88 && Y < .95 && X > .9 && X < 1.86) return Y < .9 ? .95 : .6;                                   // planter
    if (Y >= .95) return .2 * clamp((X - .3) / 1.3);
    return -1;
  } },
  { id: 'E', name: 'Hanging ketupat', note: 'Woven ketupat on strings at different heights. Festive and clearly Malay, though it leans Raya more than kenduri. Parallax: each string sways at its own depth.', fn(X, Y) {
    const items = [[1.0, .36, .09], [1.22, .55, .12], [1.45, .3, .1], [1.66, .5, .13], [1.86, .34, .09]];
    for (const [x, cy, s] of items) {
      const dx = X - x, dy = Y - cy;
      if (Math.abs(dx) / s + Math.abs(dy) / s <= 1) {
        const p = dx + dy, q = dx - dy, check = ((Math.floor(p * 34) + Math.floor(q * 34)) & 1) === 1;
        return (check ? .5 : .85) - (dx < 0 ? .15 : 0);
      }
      if (Math.abs(dx) < .004 && Y < cy - s) return .55;                                                        // string
      if (Y > cy + s && Y < cy + s + .09) for (const k of [-1, 1]) if (Math.abs(dx - k * (Y - cy - s) * .35) < .006) return .75; // tail ribbons
    }
    return -1;
  } },
  { id: 'F', name: 'Feast table', note: 'A side view of one buffet table: nasi minyak dome, curry bowl, teapot, stacked plates, sirap jug. Every object different, so no repetition. Parallax: items vs table vs back wall.', fn(X, Y) {
    const top = .7;
    if (Y >= top && X > .7 && X < 2.05) { if (Y < top + .045 * hang(frac(X * 8))) return .95; return Y < .92 ? .13 : -1; }
    if (Y >= top - .03 && Y < top && X > .76 && X < 1.14) return .8;                                          // dulang under the rice
    if (Y < top - .03 && inEll(X, Y, .95, top - .03, .16, .15)) return .18 + .14 * (X - .8) * 2 + (noise2(X * 60, Y * 60) > .7 ? .2 : 0); // rice dome
    if (Y < top && Y > top - .1 && inEll(X, Y, 1.27, top - .1, .1, .1)) return Y < top - .085 ? .7 : .9;       // bowl of curry
    if (inEll(X, Y, 1.5, top - .085, .075, .085)) return X < 1.5 ? .55 : .85;                                 // teapot body
    if (segDist(X, Y, 1.57, top - .09, 1.65, top - .15) < .012) return .85;                                   // spout
    if (inEll(X, Y, 1.5, top - .18, .02, .018)) return .9;                                                    // lid knob
    if (X > 1.7 && X < 1.86 && Y < top && Y > top - .1) return frac((top - Y) / .016) < .55 ? .9 : .3;        // stacked plates
    if (X > 1.9 && X < 1.98 && Y < top && Y > top - .2) return Y > top - .12 ? .85 : .25;                     // sirap jug
    return -1;
  } },
  { id: 'G', name: 'Dithered food photo', note: 'Our nasi lemak photo turned into blue dots, fading in from the left. Richest detail, least work. Scroll idea: dots start coarse and sharpen.', photo: 'assets/nasi-lemak.jpg' },
  { id: 'H', name: 'Aroma ribbons (abstract)', note: 'No object, just flowing steam/aroma lines rising on the right. Calm and modern, but says "food" only with the headline next to it.', fn(X, Y) {
    for (let i = 0; i < 7; i++) {
      const x0 = .95 + i * .15, xc = x0 + .08 * Math.sin(Y * 7 + i * 1.7) + .04 * Math.sin(Y * 17 + i);
      const w = .012 + .02 * (1 - Y);
      if (Math.abs(X - xc) < w && Y > .05 + .3 * frac(i * .37)) return clamp(.3 + .5 * (X - .9) + .2 * (1 - Y));
    }
    return -1;
  } },
  { id: 'J', name: 'Kawah framed by bunga manggar', note: 'The researcher&rsquo;s pick: the kawah (with its long paddle) in the centre, bunga manggar framing both edges like a front gate. Parallax: manggar near and fast, kawah middle, steam drifting slowest.', fn(X, Y) {
    for (const [x, top, R] of [[.78, .2, .16], [1.94, .16, .17]]) {                                            // manggar on both sides
      const dx = X - x, dy = Y - top, d = Math.hypot(dx, dy);
      if (d < R && d > .012) { const k = frac(Math.atan2(dy, dx) / (2 * Math.PI) * 24 + d * 3); if (k < .17) return d > R * .85 ? .95 : .45 + .4 * d / R; }
      if (d <= .016) return .95;
      if (Math.abs(dx) < .007 && Y > top && Y < .96) return .78;
    }
    if (Y < .58 && segDist(X, Y, 1.62, .3, 1.42, .6) < .011) return .8;                                          // senduk kawah (paddle)
    if (Y < .58 && inEll(X, Y, 1.63, .29, .035, .02)) return .85;
    return SCENES.find(x => x.id === 'B').fn(X, Y);
  } },
  { id: 'I', name: 'Kawah in real ASCII characters', note: 'The same pot and steam, but drawn with text characters ( .:-=+*#@ ) instead of dots: literal ASCII art. Stands out more, a bit more "techy".', ascii: 'B' }
];

function render(cv, s) {
  const W = cv.clientWidth, H = cv.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (s.ascii) return renderAscii(ctx, W, H, SCENES.find(x => x.id === s.ascii).fn);
  const cell = 3, cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
  const paths = PAL.map(() => new Path2D());
  let sample = null;
  if (s.photo) sample = photoSampler(s.img, cols, rows);
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    const X = c * cell / H, Y = r * cell / H;
    let v = sample ? sample(c, r) * clamp((c / cols - .15) / .45) : s.fn(X, Y);
    if (v < 0) continue;
    v = clamp(v + (.55 * noise2(c / 20, r / 2.5) + .45 * noise2(c / 4 + 50, r / 4) - .5) * .14);
    const x = v * (PAL.length - 1), lo = Math.floor(x);
    let h = Math.imul(c, 374761393) + Math.imul(r, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177);
    const thr = .5 * BAYER[(r & 3) * 4 + (c & 3)] + .5 * (((h ^ (h >>> 16)) >>> 0) / 4294967296);
    const k = Math.min(PAL.length - 1, lo + ((x - lo) > thr ? 1 : 0));
    if (k) paths[k].rect(c * cell, r * cell, cell - 1, cell - 1);
  }
  paths.forEach((p, k) => { if (k) { ctx.fillStyle = PAL[k]; ctx.fill(p); } });
}

// photo -> darkness per cell, cover-fit
function photoSampler(img, cols, rows) {
  const off = document.createElement('canvas'); off.width = cols; off.height = rows;
  const o = off.getContext('2d'), sc = Math.max(cols / img.width, rows / img.height);
  o.drawImage(img, (cols - img.width * sc) / 2, (rows - img.height * sc) / 2, img.width * sc, img.height * sc);
  const d = o.getImageData(0, 0, cols, rows).data;
  return (c, r) => { const i = (r * cols + c) * 4, L = (.3 * d[i] + .59 * d[i + 1] + .11 * d[i + 2]) / 255; return clamp((1 - L) * 1.25 - .08); };
}

function renderAscii(ctx, W, H, fn) {
  const cw = 7, ch = 12, chars = ' .:-=+*#%@';
  ctx.font = '600 11px "JetBrains Mono", monospace'; ctx.textBaseline = 'top';
  for (let y = 0; y < H; y += ch) for (let x = 0; x < W; x += cw) {
    const v = fn(x / H, y / H); if (v < 0) continue;
    const k = Math.round(clamp(v) * (chars.length - 1)); if (!k) continue;
    ctx.fillStyle = PAL[Math.min(PAL.length - 1, 3 + Math.round(clamp(v) * 7))];
    ctx.fillText(chars[k], x, y);
  }
}

const grid = document.getElementById('grid');
for (const s of SCENES) {
  const fig = document.createElement('figure');
  fig.innerHTML = `<canvas aria-label="Option ${s.id}: ${s.name}" role="img"></canvas><figcaption><span class="tag">OPTION ${s.id}</span><b>${s.name}</b><p>${s.note}</p></figcaption>`;
  grid.append(fig);
  const cv = fig.querySelector('canvas');
  if (s.photo) { s.img = new Image(); s.img.onload = () => render(cv, s); s.img.src = s.photo; }
  else document.fonts.ready.then(() => render(cv, s));
}
</script>
</body>
</html>
